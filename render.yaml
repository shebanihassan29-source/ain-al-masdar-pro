# Render Blueprint — create via: Dashboard -> New -> Blueprint -> pick this (private) repo
services:
  - type: web
    name: ain-al-masdar-pro
    runtime: node
    plan: free                 # free instances sleep after ~15 min idle (first request then takes a while)
    buildCommand: node organize.js && npm ci   # organize.js puts flat-uploaded files into their folders
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true    # long random value generated by Render
      - key: ADMIN_KEY
        generateValue: true    # read it from the Render dashboard (Environment tab) -> this is your admin password
      - key: WATERMARK_SALT
        generateValue: true    # PERMANENT secret for licence fingerprints (leak tracing). Never rotate it, never delete it.
      - key: DATABASE_URL
        sync: false            # paste your Postgres connection string in the dashboard
      - key: AI_API_KEY
        sync: false            # your OpenAI-compatible key (server-side only, never sent to browsers)
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: AI_DAILY_LIMIT
        value: "40"
      - key: AI_TRANSLATE_DAILY_LIMIT
        value: "200"
      - key: PRO_PRICE
        value: "30"
      - key: PRO_CURRENCY
        value: د.ل
      - key: PRO_PERIOD_DAYS
        value: "30"
      - key: TRIAL_DAYS
        value: "0"
      - key: PAYMENT_INSTRUCTIONS
        sync: false            # e.g. bank/e-wallet details shown to users on the account page
      - key: SUPPORT_CONTACT
        sync: false            # e.g. your WhatsApp number / e-mail, shown to subscribers on the account page
      - key: FREE_APP_URL
        value: https://shebanihassan29-source.github.io/ain-al-masdar/
